name: Import terrain textures
on:
  push:
    paths:
      - '.github/workflows/import-terrain-textures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize NASA images
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image

          sources = {
              "terrain-height.jpg": "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/topography/gebco_08_rev_elev_5400x2700.jpg",
              "terrain-color.jpg": "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-base/january/world.200401.3x5400x2700.jpg",
              "terrain-clouds.jpg": "https://assets.science.nasa.gov/content/dam/science/esd/eo/content-feature/bluemarble/images/cloud_combined_2048.jpg",
          }
          for filename, url in sources.items():
              print("Downloading", filename, "from", url)
              request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(request, timeout=60) as response:
                  data = response.read()
              image = Image.open(BytesIO(data)).convert("RGB")
              if image.size != (2048, 1024):
                  image = image.resize((2048, 1024), Image.Resampling.LANCZOS)
              image.save(filename, "JPEG", quality=85)
              print(filename, image.size)
          PY
      - name: Commit images and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terrain-height.jpg terrain-color.jpg terrain-clouds.jpg
          git rm .github/workflows/import-terrain-textures.yml
          git commit -m "Add resized Earth terrain textures"
          git push origin HEAD:main
